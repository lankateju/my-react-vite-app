trigger:
  branches:
    include:
      - dev   # or main, depending on your branch

pool:
  name: Default  # Uses your self-hosted agent

variables:
  buildDir: 'build'

steps:
  - script: |
      node -v
      npm -v
    displayName: 'Check Node.js and npm versions'

  - script: |
      npm ci
      npm run build
    displayName: 'Install dependencies and build React app'

  - task: CopyFiles@2
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)/$(buildDir)'
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
    displayName: 'Copy build files to staging directory'

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'reactapp'
    displayName: 'Publish build artifacts'
