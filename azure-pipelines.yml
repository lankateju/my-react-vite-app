trigger:
  branches:
    include:
      - dev

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '16.x'
    displayName: 'Install Node.js'

  - script: |
      npm install
      npm run build
    displayName: 'Build React App'

  - task: AzureCLI@2
    inputs:
      azureSubscription: 'AzureBlobConnection' # Use the exact service connection name you created
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az storage blob upload-batch \
          --account-name reactappteju \
          --destination '$web' \
          --source ./build \
          --overwrite
    displayName: 'Deploy to Azure Blob'
