trigger:
  branches:
    include:
      - dev   # or main, depending on your branch name

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildDir: 'build'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'  # use appropriate Node.js version
    displayName: 'Install Node.js'

  - script: |
      npm ci
      npm run build
    displayName: 'Install deps and build React app'

  - task: CopyFiles@2
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)/$(buildDir)'
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
    displayName: 'Copy build to staging'

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'reactapp'
    displayName: 'Publish Artifact'
